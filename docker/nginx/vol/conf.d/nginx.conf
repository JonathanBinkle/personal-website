# /etc/nginx/conf.d/nginx.conf

# Rate limiting of IPv4 /32 and IPv6 /64
map $binary_remote_addr $ip_or_slash_64 {
    "~^(\C{8})"         $1;
    default             $binary_remote_addr;
}
limit_req_zone $ip_or_slash_64 zone=ip:10m rate=5r/s;
limit_req_status 429;

# Setup caching
# - levels=1:2 := if MD5 is ...abc, file stored as /var/cache/nginx/a/bc/...abc
# - 10m := enough space for about 80.000 keys
# - inactive=60m := remove entry after 60 minutes of not being accessed
# - max_size=1g := cache occupies at most 1 GB; if full, use LRU replacement
# - use_temp_path=off := put temporary files directly into the cache
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mycache:10m max_size=1g
                 inactive=60m use_temp_path=off;

# Disable showing the nginx version on error pages etc.
server_tokens off;

# Define a server group "gunicorn". If I had multiple gunicorn containers
# (docker compose ... --scale django=N), then I would reference all of them
# here. NGINX would load balance between them (default: round-robin style).
upstream gunicorn {
    # Docker creates DNS entry ("django" <-> container_IP) automatically
    server django:8000;
}

# Keep HTTP port open but permantely redirect (301) to HTTPS port.
server {
    listen 1337;
    listen [::]:1337;
    http2 on;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    listen 1338 ssl;
    listen [::]:1338 ssl;
    http2 on;

    include /etc/nginx/vol/tls.conf;

    # Allow queueing of 10 requests after rate limit is exceeded. This is
    # important on first-time visits or no-cache, when static files are
    # requested.
    limit_req zone=ip burst=10 nodelay;

    # Default max. upload size is 1MB => "413 Request Entity Too Large" if
    # you try to upload a blog image >1MB. Thus, set to 10MB.
    # See https://stackoverflow.com/questions/28476643
    client_max_body_size 10m;

    # Enable GZIP compression
    # https://github.com/h5bp/server-configs-nginx/blob/main/h5bp/web_performance/compression.conf
    gzip on;
    gzip_comp_level 6;      # range 1-9; compromise between CPU time and file size
    gzip_min_length 256;    # small files won't shrink much; save CPU time
    gzip_types              # MIME types to compress; text/html always compressed
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # If maintenance.html exists, we're in maintenance mode
    if (-f /etc/nginx/error_pages/maintenance.html) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        root /etc/nginx/error_pages;
        rewrite ^(.*)$ /maintenance.html break;
    }
    
    location /media/ {
        autoindex off;
        alias /home/django/mediafiles/;

        # Tell client to cache the file
        expires 1d; # Cache-Control: max-age=
        add_header Cache-Control "public";
    }

    location /static/ {
        autoindex off;
        alias /home/django/staticfiles/;

        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        # Pass 'Host' header for CSRF_TRUSTED_ORIGINS to work
        proxy_set_header Host $host;

        # Let Django know whether request was send over HTTP or HTTPS
        # https://docs.djangoproject.com/en/4.2/ref/settings/#secure-proxy-ssl-header
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reverse proxy in front of gunicorn server group
        proxy_pass http://gunicorn;

        # Use cache for GET, HEAD requests, unless 'Cache-Control' header tells
        # not to, or user is logged-in (i.e. sessionid cookie is set).
        proxy_cache mycache;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $cookie_sessionid $http_cache_control;
        proxy_no_cache $cookie_sessionid $http_cache_control;
        # NOTE: uncomment for debugging:
        # add_header X-Cache-Status $upstream_cache_status;
    }
}
