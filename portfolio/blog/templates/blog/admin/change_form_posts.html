{% extends 'admin/change_form.html' %}

{% block after_field_sets %}

    <strong>Markdown Snippets:</strong>
    <ul>
    {% for description, code in snippets.items %}
        <li>{{ description }}</li>
        <pre>
            {% autoescape on %}
            {{ code }}
            {% endautoescape %}
        </pre>
    {% endfor %}
    </ul>

{% endblock %}
