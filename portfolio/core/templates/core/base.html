{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="{% block meta-description %}Personal website.{% endblock %}">
    <meta name="keywords"
          content="{% block meta-keywords %}{% endblock %}blog, computer science">
    <meta name="author" content="Jonathan Binkle">
    <title>
        {% block title %}Jonathan Binkle{% endblock %}
    </title>
    <link rel="stylesheet" href="{% static '/bootstrap-5.3.2-dist/css/bootstrap.min.css' %}"
    integrity="sha384-MMsZEjdE0PMSUx2sjbUGQmaFHhzwo7MfZ7U3wMHLRqiLWuxrQZ1gw9+zhUMhRpkx">
    <link rel="stylesheet" href="{% static '/codehilite.css' %}"
    integrity="sha384-Y2YRaXft4qJdIrgMtCfmm1bOJq9P8Q2KdB2hsCAaY5Rx6xk/OPH2mOSIPExCMzKE">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    {% include "core/navbar.html" %}

    <div class="container mt-2">
        <noscript>
            <div class="alert alert-warning" role="alert">
                <strong>Warning:</strong>
                JavaScript is disabled in your browser.
                Some features may not work correctly.
            </div>
        </noscript>

        {% block content %}{% endblock %}
    </div>
   
    <script
        src="{% static '/jquery-3.7.1.min.js' %}"
        integrity="sha384-MnTx5+eP/OUWPb9SjwMXShfMET3B3r3gx6HJWG+7Lj6kag+yreDUSG5FDWWG/SHA"></script>
    <script
        src="{% static '/jquery-migrate-3.4.0.min.js' %}"
        integrity="sha384-HbYKyKSeFb1KtRyllO9q3Dkun8dH7Ozp1BnBM6K/Jhk42txvHCYfc0SmfmBZBJF6"></script>
    <script
        src="{% static '/bootstrap-5.3.2-dist/js/bootstrap.bundle.min.js' %}"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"></script>
    
    {% block scripts %}{% endblock %}
</body>

<div class="container">
    {% include "core/footer.html" %}
</div>
</html>
